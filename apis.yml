name: Hundeland
description: Hundeland was a German direct-to-consumer online shop for dog supplies — dog food,
  treats, accessories, and pet-care products — and a portfolio company of the Point Nine venture
  capital firm. The hundeland.de storefront has been permanently closed ("dauerhaft geschlossen")
  and now 302-redirects to Pets Premium (petspremium.de), operated by the same company, which
  carries the same brands and product range; former customers must re-register there. Hundeland
  publishes no public API, developer portal, documentation, or SDKs, so the enrichment pipeline
  found no API surface to harvest. This record is retained as a Point Nine portfolio lead with the
  real closure status captured; the only machine-verifiable artifact is the domain-security probe of
  the still-resolving hundeland.de host that serves the redirect.
